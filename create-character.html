<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Character — Runeboard</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="create-character">

  <div class="inner-page">

    <nav class="inner-nav">
      <a href="player-tools.html" class="logo" style="text-decoration:none;">Rune<span>board</span></a>
      <div class="home-nav-actions">
        <a href="player-tools.html" class="btn btn-ghost" style="font-size:12px;">← My Characters</a>
        <button id="settings-btn" class="btn btn-ghost btn-icon" title="Settings">⚙</button>
      </div>
    </nav>

    <div class="home-divider"></div>

    <main class="inner-main">
      <div class="inner-card glass-panel" style="text-align:center;">
        <div style="font-size:48px; margin-bottom:var(--space-5);">⚒️</div>
        <h2 class="glass-panel-title">Character Creator</h2>
        <p class="glass-panel-sub" style="max-width:420px; margin:0 auto;">
          The full character creation wizard is coming next. Check back soon.
        </p>
      </div>
    </main>

  </div>

  <!-- Settings panel -->
  <aside id="settings-panel" class="settings-panel">
    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button id="settings-close" class="modal-close">×</button>
    </div>
    <div class="settings-body">
      <div class="settings-group">
        <span class="settings-label">Appearance</span>
        <div class="settings-row">
          <span>Theme</span>
          <button id="theme-toggle" class="btn btn-ghost theme-toggle-btn">
            <span id="theme-toggle-icon">☀️</span>
            <span id="theme-toggle-label">Light Mode</span>
          </button>
        </div>
      </div>
      <div class="settings-group">
        <span class="settings-label">Account</span>
        <div id="settings-auth-row" class="settings-row"></div>
      </div>
    </div>
  </aside>

  <div id="toast-container"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
