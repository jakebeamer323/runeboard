<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Character — Runeboard</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/creator.css" />
</head>
<body data-page="create-character">

  <div class="creator-page" id="creator-page">

    <!-- Top nav -->
    <nav class="creator-nav">
      <a href="player-tools.html" class="logo" style="text-decoration:none;flex-shrink:0;">Rune<span>board</span></a>
      <span class="creator-nav-title" id="creator-nav-title">New Character</span>
      <div class="creator-nav-actions">
        <button id="save-draft-btn" class="btn btn-ghost" style="font-size:12px;">Save Draft</button>
        <button id="settings-btn" class="btn btn-ghost btn-icon" title="Settings">⚙</button>
      </div>
    </nav>

    <!-- Tab bar -->
    <div class="creator-tab-bar" id="creator-tab-bar">
      <!-- populated by wizard.js -->
    </div>

    <!-- Tab content -->
    <div class="creator-content" id="creator-content">
      <!-- populated by wizard.js -->
    </div>

    <!-- Footer nav -->
    <footer class="creator-footer">
      <div>
        <button id="prev-btn" class="btn btn-ghost">← Back</button>
      </div>
      <div class="creator-footer-center">
        <span id="creator-step-label">Step 1 of 9</span>
      </div>
      <div class="creator-footer-right">
        <button id="next-btn" class="btn btn-primary">Next →</button>
        <button id="finish-btn" class="btn btn-primary" style="display:none;">Save Character</button>
      </div>
    </footer>

  </div>

  <!-- Source filter panel (slide-in from right) -->
  <div id="source-filter-overlay" class="source-filter-overlay"></div>
  <div id="source-filter-panel" class="source-filter-panel">
    <!-- populated by source-filter.js -->
  </div>

  <!-- Settings panel -->
  <aside id="settings-panel" class="settings-panel">
    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button id="settings-close" class="modal-close">×</button>
    </div>
    <div class="settings-body">
      <div class="settings-group">
        <span class="settings-label">Appearance</span>
        <div class="settings-row">
          <span>Theme</span>
          <button id="theme-toggle" class="btn btn-ghost theme-toggle-btn">
            <span id="theme-toggle-icon">☀️</span>
            <span id="theme-toggle-label">Light Mode</span>
          </button>
        </div>
      </div>
      <div class="settings-group">
        <span class="settings-label">Account</span>
        <div id="settings-auth-row" class="settings-row"></div>
      </div>
    </div>
  </aside>

  <div id="toast-container"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
