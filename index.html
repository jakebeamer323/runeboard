<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runeboard</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="home">

  <div class="landing">

    <!-- Header -->
    <header class="landing-header">
      <span class="logo">Rune<span>board</span></span>
      <p class="landing-tagline">Virtual tabletop for D&amp;D 5e</p>
    </header>

    <!-- Display name -->
    <div class="landing-name">
      <label class="form-label" for="display-name">Your Name</label>
      <input
        id="display-name"
        type="text"
        placeholder="How shall you be known?"
        maxlength="32"
        autocomplete="off"
      />
    </div>

    <!-- Cards -->
    <div class="landing-cards">

      <!-- Create room -->
      <div class="card">
        <h2 style="font-size:14px; margin-bottom:16px;">Create a Room</h2>
        <label class="form-label" for="room-name-input">Room Name</label>
        <input
          id="room-name-input"
          type="text"
          placeholder="e.g. The Sunken Keep"
          maxlength="48"
          autocomplete="off"
          style="margin-bottom:12px;"
        />
        <p id="create-error" class="error-msg" style="display:none; color:var(--danger); font-size:12px; margin-bottom:8px;"></p>
        <button id="create-room-btn" class="btn btn-primary btn-full">Create Room</button>
        <p style="font-size:11px; color:var(--text-muted); margin-top:10px; text-align:center;">
          You'll be the Dungeon Master
        </p>
      </div>

      <!-- Join room -->
      <div class="card">
        <h2 style="font-size:14px; margin-bottom:16px;">Join a Room</h2>
        <label class="form-label" for="join-code-input">Room Code</label>
        <input
          id="join-code-input"
          type="text"
          placeholder="e.g. X4R9KM"
          maxlength="6"
          autocomplete="off"
          style="text-transform:uppercase; letter-spacing:0.15em; margin-bottom:12px;"
        />
        <p id="join-error" class="error-msg" style="display:none; color:var(--danger); font-size:12px; margin-bottom:8px;"></p>
        <button id="join-room-btn" class="btn btn-ghost btn-full">Join Room</button>
        <p style="font-size:11px; color:var(--text-muted); margin-top:10px; text-align:center;">
          Ask your DM for the code
        </p>
      </div>

    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
